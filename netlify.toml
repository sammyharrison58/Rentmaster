# Netlify Configuration for Rentmaster
[build]
  command = "npm install && (chmod -R +x node_modules/.bin 2>/dev/null || true) && node node_modules/vite/bin/vite.js build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Proxy /api/mpesa/stkpush to serverless function
[[redirects]]
  from = "/api/mpesa/stkpush"
  to = "/.netlify/functions/mpesa-stkpush"
  status = 200
  force = true

# Proxy /api/mpesa/query to serverless function
[[redirects]]
  from = "/api/mpesa/query"
  to = "/.netlify/functions/mpesa-query"
  status = 200
  force = true

# Proxy /api/webhook/mpesa-callback to serverless function
[[redirects]]
  from = "/api/webhook/mpesa-callback"
  to = "/.netlify/functions/mpesa-callback"
  status = 200
  force = true

# Proxy /api/sync to cloud sync serverless function
[[redirects]]
  from = "/api/sync"
  to = "/.netlify/functions/sync"
  status = 200
  force = true

# SPA fallback redirect for any client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Aggressive asset caching: hashed JS, CSS, and chunks load instantly from cache (1 Year Immutable)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# High-performance caching for optimized property imagery
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

# SVG Favicon & Logo caching
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Root HTML documents must revalidate to pick up latest build hashes, with security headers
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
